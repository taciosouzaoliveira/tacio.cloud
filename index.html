<style>
:root{--bg:#0b0f17;--card:#161b22;--card2:#1c2230;--line:#30363d;--text:#c9d1d9;--muted:#8b949e;--blue:#58a6ff;--green:#3fb950;--amber:#d29922}
@media (prefers-color-scheme:light){:root{--bg:#f6f8fa;--card:#fff;--card2:#f0f3f6;--line:#d0d7de;--text:#24292f;--muted:#57606a;--blue:#0969da;--green:#1a7f37;--amber:#9a6700}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--blue)}
a:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
main{max-width:720px;margin:0 auto;padding:3rem 1rem 4rem}
h1,h2{font-family:"Ubuntu","Segoe UI",system-ui,sans-serif;font-weight:700}

.hero{text-align:center}
.avatar{width:144px;height:144px;border-radius:50%;object-fit:cover;border:3px solid var(--blue);box-shadow:0 0 0 6px color-mix(in srgb,var(--blue) 18%,transparent)}
h1{font-size:clamp(2rem,6vw,2.6rem);margin:1rem 0 .25rem;letter-spacing:-.01em}
.role{color:var(--blue);font-weight:600;margin:0}
.loc{color:var(--muted);font-size:.95rem;margin:.25rem 0 1rem}
.tagline{max-width:52ch;margin:0 auto 1.25rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;padding:0;margin:0;list-style:none}
.chips li{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .75rem;font-size:.85rem}
.social{display:flex;gap:1.25rem;justify-content:center;margin-top:1.25rem;font-size:1.5rem}
.social a{color:var(--muted);text-decoration:none;transition:color .2s}
.social a:hover{color:var(--blue)}

section{margin-top:2.75rem}
h2{font-size:1.25rem;margin:0 0 1rem}

.links{display:grid;gap:.75rem}
.link{display:flex;align-items:center;gap:1rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem 1.25rem;text-decoration:none;color:var(--text);transition:border-color .2s,transform .2s}
.link:hover{border-color:var(--blue);transform:translateY(-2px)}
.link i.ico{font-size:1.4rem;width:2.5rem;height:2.5rem;display:grid;place-items:center;border-radius:10px;background:var(--card2);color:var(--blue);flex-shrink:0}
.link.primary{border-left:3px solid var(--green)}
.link.primary i.ico{color:var(--green)}
.link strong{display:block}
.link span{color:var(--muted);font-size:.9rem;display:block;line-height:1.4}
.link .go{margin-left:auto;color:var(--muted)}

.about p{
  margin:0 0 1rem;
  text-align:justify;
}

.certs{display:grid;grid-template-columns:auto 1fr;gap:1.25rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.25rem}
.certs img{width:110px;height:110px;display:block}
.certs ul{list-style:none;padding:0;margin:0;display:grid;gap:.4rem}
.certs li{display:flex;gap:.6rem;align-items:baseline;font-size:.95rem}
.certs li i{width:1rem;text-align:center}
.ok{color:var(--green)}.wip{color:var(--amber)}.next{color:var(--muted)}
.certs small{color:var(--muted)}

.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 1.1rem 1.25rem}
.timeline li::before{content:"";position:absolute;left:-7px;top:.45rem;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--blue)}
.timeline strong{display:block}
.timeline span{color:var(--muted);font-size:.9rem}

footer{margin-top:3rem;padding-top:1.25rem;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;text-align:center}
@media (max-width:520px){.certs{grid-template-columns:1fr;justify-items:center}.certs ul{justify-self:stretch}}
</style>
